<!-- Share the app logo with the Desk dock and sidebar header so branding stays in sync. -->
<svg id="vunapos-symbols" aria-hidden="true" style="display: none;" xmlns="http://www.w3.org/2000/svg">
	<symbol id="icon-vunapos-duotone" viewBox="0 0 24 24">
		<image width="24" height="24" href="/assets/vunapos/logo.png"/>
	</symbol>
	<!-- Two-tone icons for the POS and VunaPOS Restaurant dock rows, in the style of ERPNext's
	     module-icons.svg: filled shapes toned by the light/dark duotone variables, with the same
	     resting fallbacks, so the dock's active and dark-theme tones apply to them too. -->
	<symbol id="icon-vunapos-till-duotone" viewBox="0 0 24 24" stroke="none">
		<rect x="5.5" y="2" width="13" height="7.5" rx="1.5" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="10.5" y="9.5" width="3" height="2" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path fill-rule="evenodd" d="M4 11.5H20L21.5 21.5H2.5Z M6.5 14H9.5V15.8H6.5Z M10.5 14H13.5V15.8H10.5Z M14.5 14H17.5V15.8H14.5Z M6.2 17.3H9.4V19.1H6.2Z M10.5 17.3H13.5V19.1H10.5Z M14.6 17.3H17.8V19.1H14.6Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
	<symbol id="icon-vunapos-cloche-duotone" viewBox="0 0 24 24" stroke="none">
		<circle cx="12" cy="5" r="1.8" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M3 16.5A9 9 0 0 1 21 16.5Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="1.5" y="17.5" width="21" height="2.5" rx="1.25" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
</svg>
